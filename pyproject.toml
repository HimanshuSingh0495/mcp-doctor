[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-doctor"
version = "0.1.0"
description = "Validate MCP (Model Context Protocol) server setups: config schema, launchability, stdio handshake, and tool listing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Himanshu Singh", email = "singh.himanshu0495@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "json-rpc", "cli", "validation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.scripts]
mcp-doctor = "mcp_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/HimanshuSingh0495/mcp-doctor"
Repository = "https://github.com/HimanshuSingh0495/mcp-doctor"
Issues = "https://github.com/HimanshuSingh0495/mcp-doctor/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_doctor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
